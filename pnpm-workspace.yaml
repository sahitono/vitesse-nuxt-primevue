allowBuilds:
  '@morev/vue-transitions': true
  esbuild: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - package-manager-detector@1.9.0

strictPeerDependencies: false
autoInstallPeers: false
shellEmulator: true

catalogMode: strict
cleanupUnusedCatalogs: true
catalog:
  "@antfu/eslint-config": "^9.3.0"
  "@eslint/eslintrc": "^3.3.6"
  "@fontsource-variable/ibm-plex-sans": "^5.3.0"
  "@iconify-json/hugeicons": "^1.2.33"
  "@iconify-json/solar": "^1.2.9"
  "@iconify-json/twemoji": "^1.2.5"
  "@iconify/tailwind4": "^1.2.3"
  "@morev/vue-transitions": "^3.0.5"

  "@nuxt/devtools": "^3.4.2"
  "@nuxt/eslint": "^1.17.0"
  "@nuxt/image": "^2.1.0"
  "@nuxtjs/color-mode": "^4.0.1"
  "@nuxtjs/i18n": "^10.6.0"
  nuxt: "^4.5.2"

  "@openvue/forms": "1.0.0"
  "@openvue/nuxt-module": "1.0.0"
  "@openvue/themes": "1.0.0"

  "@pinia/nuxt": "^1.0.2"
  pinia: "^4.0.3"

  "@tailwindcss/vite": "^4.3.3"
  tailwindcss: "^4.3.3"
  tailwindcss-primeui: "^0.6.1"

  "@vee-validate/nuxt": "^4.15.1"
  vee-validate: "^4.15.1"

  "@vite-pwa/nuxt": "^1.1.1"

  "@vueuse/nuxt": "^14.4.0"
  consola: "^3.4.2"
  eslint: "^10.9.1"
  eslint-plugin-better-tailwindcss: "^4.7.0"
  eslint-plugin-format: "^2.0.1"

  hash-wasm: "^4.12.0"
  taze: "^21.1.0"
  ts-pattern: "^5.9.0"
  typescript: "^6.0.0"
  uuid: "^14.0.2"
  uuidv7: "^1.2.1"
  vue-tsc: "^3.3.11"
  zod: "^4.4.3"

  # Transitive dependencies pinned through overrides
  unplugin: "^3.3.0"
  vite: "^8.2.2"
  geojson: ^0.5.0
  vue-eslint-parser: ^10.4.1
  openvue: ^1.0.0
overrides:
  "@nuxt/devtools": "catalog:"
  unplugin: "catalog:"
  vite: "catalog:"
  primevue: "npm:openvue@1.0.0"
